# ============================================================
# Nginx Stream (TCP) - Proxy para Rastreadores GPS
# ============================================================
#
# Este arquivo configura o proxy TCP para a porta 8877
# onde os rastreadores GPS se conectam.
#
# NOTA: Este arquivo deve ser incluído no bloco 'stream' do nginx.conf
# ============================================================

# Upstream para servidores TCP (rastreadores)
upstream rastreador_tcp {
    # Estratégia: least_conn para distribuir conexões TCP
    least_conn;

    # Servidor principal
    server 127.0.0.1:18877 max_fails=3 fail_timeout=30s;

    # Adicione mais instâncias aqui quando escalar:
    # server 127.0.0.1:18878 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:18879 max_fails=3 fail_timeout=30s;
}

# Servidor TCP para rastreadores (porta 8877)
server {
    listen 8877;
    listen [::]:8877;

    proxy_pass rastreador_tcp;

    # Timeouts para conexões de rastreadores
    proxy_connect_timeout 10s;
    proxy_timeout 24h;  # Rastreadores mantêm conexão por muito tempo

    # Habilitar TCP keepalive
    proxy_socket_keepalive on;
}
