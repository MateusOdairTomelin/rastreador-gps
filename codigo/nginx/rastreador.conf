# ============================================================
# Nginx Load Balancer - Sistema de Rastreamento Veicular
# ============================================================
#
# Funcionalidades:
# - Load balancing entre múltiplas instâncias da aplicação
# - Proxy reverso para HTTP/API
# - WebSocket para tempo real
# - Preparado para SSL/HTTPS (futuro)
#
# Portas:
# - 80   → HTTP (redireciona para HTTPS quando SSL ativo)
# - 443  → HTTPS (quando SSL configurado)
# - 8877 → TCP para rastreadores (stream)
# ============================================================

# ============ UPSTREAM - INSTÂNCIAS DA APLICAÇÃO ============
# Master + 3 Workers para load balancing

upstream rastreador_http {
    # Estratégia: least_conn para distribuir carga por conexões ativas
    least_conn;

    # Master (TCP + HTTP) - peso maior por ser mais robusto
    server 127.0.0.1:62000 weight=2 max_fails=3 fail_timeout=30s;

    # Workers (HTTP apenas)
    server 127.0.0.1:62001 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:62002 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:62003 weight=1 max_fails=3 fail_timeout=30s;

    # Keepalive connections para melhor performance
    keepalive 64;
}

# Upstream para WebSocket com sticky sessions (ip_hash)
upstream rastreador_ws {
    ip_hash;  # Garante que mesmo cliente vai para mesma instância

    server 127.0.0.1:62000 weight=2 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:62001 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:62002 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:62003 weight=1 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

# ============ SERVIDOR HTTP/HTTPS ============

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Logs
    access_log /var/log/nginx/rastreador_access.log;
    error_log /var/log/nginx/rastreador_error.log;

    # Limites de tamanho
    client_max_body_size 10M;

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ============ WEBSOCKET ============
    location /ws {
        proxy_pass http://rastreador_ws;
        proxy_http_version 1.1;

        # Headers necessários para WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para WebSocket (conexões longas)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Desabilitar buffer para tempo real
        proxy_buffering off;
    }

    # ============ API REST ============
    location /api {
        proxy_pass http://rastreador_http;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ============ ARQUIVOS ESTÁTICOS ============
    location / {
        proxy_pass http://rastreador_http;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Cache de arquivos estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://rastreador_http;
            proxy_cache_valid 200 1d;
            add_header Cache-Control "public, immutable, max-age=86400";
        }
    }

    # ============ HEALTH CHECK ============
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ============ NGINX STATUS (interno) ============
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        deny all;
    }
}

