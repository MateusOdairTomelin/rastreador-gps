# ============================================================================
# HAPROXY - Load Balancer ESCALADO (4 TCP Gateways + 2 APIs)
# ============================================================================

global
    maxconn 8000
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 10s
    timeout client 120s
    timeout server 120s
    retries 3

# =============================================================================
# FRONTEND TCP - Porta 8877 (XT40/GT06)
# =============================================================================
frontend tcp_xt40_frontend
    bind *:8877
    mode tcp
    option tcplog
    default_backend tcp_gateways_xt40

backend tcp_gateways_xt40
    mode tcp
    balance source
    hash-type consistent
    option tcp-check

    server gw-1 rastreador-tcp-gw-1:8877 check inter 5s fall 3 rise 2 weight 100
    server gw-2 rastreador-tcp-gw-2:8877 check inter 5s fall 3 rise 2 weight 100
    server gw-3 rastreador-tcp-gw-3:8877 check inter 5s fall 3 rise 2 weight 100
    server gw-4 rastreador-tcp-gw-4:8877 check inter 5s fall 3 rise 2 weight 100

# =============================================================================
# FRONTEND TCP - Porta 8878 (XT40 OBD2)
# =============================================================================
frontend tcp_obd2_frontend
    bind *:8878
    mode tcp
    option tcplog
    default_backend tcp_gateways_obd2

backend tcp_gateways_obd2
    mode tcp
    balance source
    hash-type consistent
    option tcp-check

    server gw-1 rastreador-tcp-gw-1:8878 check inter 5s fall 3 rise 2 weight 100
    server gw-2 rastreador-tcp-gw-2:8878 check inter 5s fall 3 rise 2 weight 100
    server gw-3 rastreador-tcp-gw-3:8878 check inter 5s fall 3 rise 2 weight 100
    server gw-4 rastreador-tcp-gw-4:8878 check inter 5s fall 3 rise 2 weight 100

# =============================================================================
# FRONTEND TCP - Porta 8879 (Teltonika)
# =============================================================================
frontend tcp_teltonika_frontend
    bind *:8879
    mode tcp
    option tcplog
    default_backend tcp_gateways_teltonika

backend tcp_gateways_teltonika
    mode tcp
    balance source
    hash-type consistent
    option tcp-check

    server gw-1 rastreador-tcp-gw-1:8879 check inter 5s fall 3 rise 2 weight 100
    server gw-2 rastreador-tcp-gw-2:8879 check inter 5s fall 3 rise 2 weight 100
    server gw-3 rastreador-tcp-gw-3:8879 check inter 5s fall 3 rise 2 weight 100
    server gw-4 rastreador-tcp-gw-4:8879 check inter 5s fall 3 rise 2 weight 100

# =============================================================================
# FRONTEND HTTP - Porta 62000 (API/WebSocket)
# =============================================================================
frontend http_frontend
    bind *:62000
    mode http
    option httplog
    option forwardfor

    # Detectar WebSocket
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_websocket hdr(Connection) -i upgrade

    default_backend api_servers

backend api_servers
    mode http
    balance roundrobin
    option httpchk GET /api/status
    http-check expect status 200

    # Sticky sessions para WebSocket
    cookie SERVERID insert indirect nocache

    server api-1 rastreador-api-1:62000 check inter 10s fall 3 rise 2 cookie api1
    server api-2 rastreador-api-2:62000 check inter 10s fall 3 rise 2 cookie api2

# =============================================================================
# STATS - Painel de Administração
# =============================================================================
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:admin
    stats admin if TRUE
