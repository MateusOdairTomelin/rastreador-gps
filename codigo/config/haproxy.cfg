# HAProxy Configuration for GPS Tracker System
# Balanceamento de carga para TCP (rastreadores) e HTTP (API)

global
    maxconn 10000
    log stdout format raw local0
    # stats socket disabled - use stats frontend instead

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 10s
    timeout client 120s
    timeout server 120s
    retries 3

# ============================================================================
# FRONTEND TCP - Rastreadores XT40-4F (porta 8877)
# ============================================================================
frontend tcp_frontend_4f
    bind *:8877
    mode tcp
    option tcplog
    default_backend tcp_gateways_4f

# ============================================================================
# BACKEND TCP - Gateways XT40-4F (porta 8877)
# ============================================================================
backend tcp_gateways_4f
    mode tcp
    balance source
    option tcp-check
    hash-type consistent
    server gw-1 tcp-gateway-1:8877 check inter 5s fall 3 rise 2
    server gw-2 tcp-gateway-2:8877 check inter 5s fall 3 rise 2

# ============================================================================
# FRONTEND TCP - Rastreadores XT40-OBD2 (porta 8878)
# ============================================================================
frontend tcp_frontend_obd2
    bind *:8878
    mode tcp
    option tcplog
    default_backend tcp_gateways_obd2

# ============================================================================
# BACKEND TCP - Gateways OBD2 (porta 8878)
# ============================================================================
backend tcp_gateways_obd2
    mode tcp
    balance source
    option tcp-check
    hash-type consistent
    server gw-1 tcp-gateway-1:8878 check inter 5s fall 3 rise 2
    server gw-2 tcp-gateway-2:8878 check inter 5s fall 3 rise 2

# ============================================================================
# FRONTEND TCP - Rastreadores Teltonika (porta 8879)
# ============================================================================
frontend tcp_frontend_teltonika
    bind *:8879
    mode tcp
    option tcplog
    default_backend tcp_gateways_teltonika

# ============================================================================
# BACKEND TCP - Gateways Teltonika (porta 8879)
# ============================================================================
backend tcp_gateways_teltonika
    mode tcp
    balance source
    option tcp-check
    hash-type consistent
    server gw-1 tcp-gateway-1:8879 check inter 5s fall 3 rise 2
    server gw-2 tcp-gateway-2:8879 check inter 5s fall 3 rise 2

# ============================================================================
# FRONTEND HTTP - API (porta 62000)
# ============================================================================
frontend http_frontend
    bind *:62000
    mode http
    option httplog
    option forwardfor

    # WebSocket detection
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_websocket hdr(Connection) -i Upgrade

    # Usar backend HTTP
    default_backend api_servers

# ============================================================================
# BACKEND HTTP - API Servers
# ============================================================================
backend api_servers
    mode http
    balance roundrobin
    option httpchk GET /api/status
    http-check expect status 200

    # Sticky sessions para WebSocket (cookie)
    cookie SERVERID insert indirect nocache

    # API Servers
    server api-1 api-server-1:62000 check inter 10s fall 3 rise 2 cookie api1
    server api-2 api-server-2:62000 check inter 10s fall 3 rise 2 cookie api2

# ============================================================================
# STATISTICS
# ============================================================================
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats auth admin:LEsbsA9UPHz25d3XBxNmx0dObkHDJnu
