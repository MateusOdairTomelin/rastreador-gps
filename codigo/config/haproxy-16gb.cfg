# ============================================================================
# HAPROXY - Load Balancer para Servidor 16GB/8 Cores
# ============================================================================

global
    maxconn 4000
    log stdout format raw local0

# Resolver DNS do Docker para descoberta dinâmica de containers
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid     10s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 10s
    timeout client 120s
    timeout server 120s
    retries 3

# =============================================================================
# FRONTEND TCP - Porta 8877 (XT40/GT06/XT40_4F)
# Backend dedicado para rastreadores XT40 - Escalável até 8 gateways
# =============================================================================
frontend tcp_xt40_frontend
    bind *:8877
    mode tcp
    option tcplog
    default_backend tcp_gateways_xt40

backend tcp_gateways_xt40
    mode tcp
    balance source
    hash-type consistent
    option tcp-check

    # Gateways dedicados XT40 (escaláveis via API - até 8)
    # init-addr none permite iniciar mesmo se o hostname não resolver
    server xt40-1 rastreador-xt40-gw-1:8877 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none
    server xt40-2 rastreador-xt40-gw-2:8877 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none
    server xt40-3 rastreador-xt40-gw-3:8877 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none
    server xt40-4 rastreador-xt40-gw-4:8877 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none
    server xt40-5 rastreador-xt40-gw-5:8877 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none
    server xt40-6 rastreador-xt40-gw-6:8877 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none
    server xt40-7 rastreador-xt40-gw-7:8877 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none
    server xt40-8 rastreador-xt40-gw-8:8877 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none

# =============================================================================
# FRONTEND TCP - Porta 8878 (XT40 OBD2)
# Backend dedicado para rastreadores OBD2 - Escalável até 4 gateways
