    server obd2-1 rastreador-obd2-gw-1:8878 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none
    server obd2-2 rastreador-obd2-gw-2:8878 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none
    server obd2-3 rastreador-obd2-gw-3:8878 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none
    server obd2-4 rastreador-obd2-gw-4:8878 check inter 5s fall 3 rise 2 weight 100 resolvers docker init-addr none

