# ============================================================================
# HAPROXY - Load Balancer para Servidor 16GB/8 Cores
# ============================================================================

global
    maxconn 4000
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 10s
    timeout client 120s
    timeout server 120s
    retries 3

# =============================================================================
# FRONTEND TCP - Porta 8877 (XT40/GT06)
# =============================================================================
frontend tcp_xt40_frontend
    bind *:8877
    mode tcp
    option tcplog
    default_backend tcp_gateways_xt40

backend tcp_gateways_xt40
    mode tcp
    balance source
    hash-type consistent
    option tcp-check

    # Usando nomes dos serviços do docker-compose
    server gw-1 rastreador-tcp-gw-1:8877 check inter 5s fall 3 rise 2 weight 100
    server gw-2 rastreador-tcp-gw-2:8877 check inter 5s fall 3 rise 2 weight 100

# =============================================================================
# FRONTEND TCP - Porta 8878 (XT40 OBD2)
# =============================================================================
frontend tcp_obd2_frontend
    bind *:8878
    mode tcp
    option tcplog
    default_backend tcp_gateways_obd2

backend tcp_gateways_obd2
    mode tcp
    balance source
    hash-type consistent
    option tcp-check

    server gw-1 rastreador-tcp-gw-1:8878 check inter 5s fall 3 rise 2 weight 100
    server gw-2 rastreador-tcp-gw-2:8878 check inter 5s fall 3 rise 2 weight 100

# =============================================================================
# FRONTEND TCP - Porta 8879 (Teltonika)
# =============================================================================
frontend tcp_teltonika_frontend
    bind *:8879
    mode tcp
    option tcplog
    default_backend tcp_gateways_teltonika

backend tcp_gateways_teltonika
    mode tcp
    balance source
    hash-type consistent
    option tcp-check

    server gw-1 rastreador-tcp-gw-1:8879 check inter 5s fall 3 rise 2 weight 100
    server gw-2 rastreador-tcp-gw-2:8879 check inter 5s fall 3 rise 2 weight 100

# =============================================================================
# FRONTEND HTTPS - Porta 443 (API/WebSocket com SSL)
# =============================================================================
frontend https_frontend
    bind *:443 ssl crt /etc/haproxy/certs/rastreador.pem
    mode http
    option httplog
    option forwardfor

    # =========================================================================
    # RESTRIÇÃO DE IP - Apenas IPs autorizados podem acessar a plataforma
    # Rastreadores (portas TCP 8877/8878/8879) NÃO são afetados
    # =========================================================================
    acl ip_permitido src 187.85.161.250
    acl ip_permitido src 187.85.186.58
    acl ip_localhost src 127.0.0.1
    acl ip_docker src 172.16.0.0/12

    # Bloquear acesso de IPs não autorizados (retorna 403 Forbidden)
    http-request deny deny_status 403 if !ip_permitido !ip_localhost !ip_docker

    # Headers de segurança
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Adicionar header X-Forwarded-Proto
    http-request set-header X-Forwarded-Proto https

    # Detectar WebSocket
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_websocket hdr(Connection) -i upgrade

    default_backend api_servers

# =============================================================================
# FRONTEND HTTPS - Porta 80 (DESATIVADO)
# =============================================================================
# frontend http_redirect
#     bind *:80 ssl crt /etc/haproxy/certs/rastreador.pem
#     mode http
#     option httplog
#     option forwardfor
#     default_backend api_servers

# =============================================================================
# FRONTEND HTTPS - Porta 62000 (DESATIVADO PARA TESTE)
# =============================================================================
# frontend http_frontend
#     bind *:62000 ssl crt /etc/haproxy/certs/rastreador.pem
#     mode http
#     option httplog
#     option forwardfor
#
#     # Detectar WebSocket
#     acl is_websocket hdr(Upgrade) -i WebSocket
#     acl is_websocket hdr(Connection) -i upgrade
#
#     default_backend api_servers

backend api_servers
    mode http
    balance roundrobin
    option httpchk GET /api/status
    http-check expect status 200

    # Sticky sessions para WebSocket
    cookie SERVERID insert indirect nocache

    server api-1 rastreador-api-1:62000 check inter 10s fall 3 rise 2 cookie api1

# =============================================================================
# STATS - Painel de Administração
# =============================================================================
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:admin
    stats admin if TRUE
