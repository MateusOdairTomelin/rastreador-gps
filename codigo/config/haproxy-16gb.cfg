# =============================================================================
# FRONTEND HTTPS - Porta 443 (API/WebSocket com SSL)
# =============================================================================
frontend https_frontend
    bind *:443 ssl crt /etc/haproxy/certs/rastreador.pem
    mode http
    option httplog
    option forwardfor

    # ==========================================================================
    # RESTRIÇÃO DE IP - Apenas Unifique pode acessar
    # Verifica IP real (X-Forwarded-For) ou IP direto
    # ==========================================================================
    acl ip_permitido src 187.85.0.0/16
    acl ip_permitido src 10.252.0.0/16
    acl ip_permitido_xff hdr_ip(X-Forwarded-For) 187.85.0.0/16
    http-request deny deny_status 403 unless ip_permitido || ip_permitido_xff

    # Headers de segurança
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Adicionar header X-Forwarded-Proto
    http-request set-header X-Forwarded-Proto https

    # Detectar WebSocket
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_websocket hdr(Connection) -i upgrade

    # Detectar requisições de exportação (PDF/CSV) que podem demorar
    acl is_export path_beg /api/exportar

    # Rotear WebSocket para backend com timeout longo
    use_backend api_websocket if is_websocket

    # Rotear exportação para backend com timeout de 10 minutos
    use_backend api_export if is_export

    default_backend api_servers

# =============================================================================
# FRONTEND HTTPS - Porta 80 (DESATIVADO)
# =============================================================================
# frontend http_redirect
#     bind *:80 ssl crt /etc/haproxy/certs/rastreador.pem
#     mode http
#     option httplog
#     option forwardfor
#     default_backend api_servers

# =============================================================================
# FRONTEND HTTPS - Porta 62000 (DESATIVADO PARA TESTE)
# =============================================================================
# frontend http_frontend
#     bind *:62000 ssl crt /etc/haproxy/certs/rastreador.pem
#     mode http
#     option httplog
#     option forwardfor
#
#     # Detectar WebSocket
#     acl is_websocket hdr(Upgrade) -i WebSocket
#     acl is_websocket hdr(Connection) -i upgrade
#
#     default_backend api_servers

backend api_servers
    mode http
    balance roundrobin
    option httpchk GET /api/status
    http-check expect status 200

    # Sticky sessions
    cookie SERVERID insert indirect nocache

    server api-1 rastreador-api-1:62000 check inter 10s fall 3 rise 2 cookie api1

# =============================================================================
# BACKEND EXPORT - Timeout longo para relatórios grandes (PDF/CSV)
# =============================================================================
backend api_export
    mode http
    balance roundrobin
    option forwardfor

    # Timeout de 10 minutos para relatórios grandes (30/60/90 dias)
    timeout server 600s
    timeout client 600s

    server api-1 rastreador-api-1:62000 check

# =============================================================================
# BACKEND WEBSOCKET - Timeout longo para conexões persistentes
# =============================================================================
backend api_websocket
    mode http
    balance source
    option forwardfor

    # Timeout longo para WebSocket (1 hora)
    timeout tunnel 3600s
    timeout client 3600s
    timeout server 3600s

    server api-1 rastreador-api-1:62000 check

# =============================================================================
# STATS - Painel de Administração
# =============================================================================
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:admin
    stats admin if TRUE
