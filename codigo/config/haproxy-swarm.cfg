global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout tunnel  3600s

# ============ STATS ============
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

# ============ HTTP/WEBSOCKET (porta 62000) ============
frontend http_front
    bind *:62000
    mode http

    # Detectar WebSocket
    acl is_websocket hdr(Upgrade) -i websocket
    acl is_socketio path_beg /socket.io

    # Roteamento
    use_backend websocket_back if is_websocket or is_socketio
    default_backend http_back

backend http_back
    mode http
    balance roundrobin
    option httpchk GET /login.html
    http-check expect status 200

    # Sticky sessions para manter usuário no mesmo servidor
    cookie SERVERID insert indirect nocache

    # Servidores - Docker Swarm DNS (tasks.STACKNAME_SERVICENAME)
    server-template app 10 tasks.rastreador_app:62000 check resolvers docker init-addr libc,none cookie app

backend websocket_back
    mode http
    balance roundrobin

    # WebSocket precisa de sticky sessions
    stick-table type ip size 100k expire 30m
    stick on src

    # Timeouts específicos para WebSocket
    timeout tunnel 3600s
    timeout server 3600s

    server-template app 10 tasks.rastreador_app:62000 check resolvers docker init-addr libc,none

# ============ TCP RASTREADORES (porta 8877) ============
frontend tcp_front
    bind *:8877
    mode tcp
    option tcplog
    default_backend tcp_back

backend tcp_back
    mode tcp
    balance leastconn

    # Sticky por IP do rastreador (mantém conexão no mesmo servidor)
    stick-table type ip size 100k expire 60m
    stick on src

    # Health check TCP
    option tcp-check

    server-template app 10 tasks.rastreador_app:8877 check resolvers docker init-addr libc,none

# ============ DNS RESOLVER ============
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s
