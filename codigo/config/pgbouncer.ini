; ============================================================
; PgBouncer Configuration - Sistema de Rastreamento Veicular
; ============================================================
; Otimizado para 5.000 dispositivos
;
; Porta: 6432 (conexões da aplicação)
; Backend: PostgreSQL na porta 5432
; ============================================================

[databases]
; Banco de dados do rastreador
; A aplicação conecta no PgBouncer (porta 6432) em vez do PostgreSQL direto
rastreador_db = host=127.0.0.1 port=5432 dbname=rastreador_db

; Alias para compatibilidade
* = host=127.0.0.1 port=5432

[pgbouncer]
; ============ CONFIGURAÇÕES DE CONEXÃO ============

; Onde o PgBouncer escuta
listen_addr = 127.0.0.1
listen_port = 6432

; Socket Unix para conexões locais
unix_socket_dir = /var/run/postgresql

; ============ AUTENTICAÇÃO ============

; scram-sha-256 é o padrão do PostgreSQL 14+
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ============ POOL MODE ============

; transaction: libera conexão após cada transação (recomendado para apps web)
; session: mantém conexão durante toda a sessão (padrão PostgreSQL)
; statement: libera após cada statement (não suporta transações)
pool_mode = transaction

; ============ LIMITES DE CONEXÃO ============

; Máximo de conexões de clientes (aplicação -> PgBouncer)
; 5.000 dispositivos + margem para API/dashboard
max_client_conn = 1000

; Tamanho padrão do pool por banco/usuário
; Este é o número de conexões reais com o PostgreSQL
default_pool_size = 50

; Pool mínimo mantido aberto
min_pool_size = 10

; Pool de reserva para picos de carga
reserve_pool_size = 20

; Tempo para usar pool de reserva (segundos)
reserve_pool_timeout = 3

; Máximo de conexões por banco de dados
max_db_connections = 100

; ============ TIMEOUTS ============

; Timeout para conectar ao servidor PostgreSQL
server_connect_timeout = 15

; Tempo máximo de vida de uma conexão com o servidor
server_lifetime = 3600

; Fechar conexões ociosas após este tempo
server_idle_timeout = 600

; Timeout de login do cliente
client_login_timeout = 60

; Timeout de query (0 = desabilitado)
query_timeout = 0

; Tempo máximo esperando por uma conexão
query_wait_timeout = 60

; ============ LOGGING ============

logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

; Log de conexões
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Estatísticas agregadas a cada 60 segundos
stats_period = 60
log_stats = 1

; ============ ADMINISTRAÇÃO ============

; Usuários que podem acessar o console de admin (SHOW POOLS, etc)
admin_users = postgres
stats_users = postgres

; ============ TUNNING DE BAIXO NÍVEL ============

; Tamanho do buffer de pacotes
pkt_buf = 4096

; Backlog de conexões pendentes
listen_backlog = 256

; TCP keepalive
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_keepcnt = 3

; ============ RESET DE CONEXÃO ============

; Query executada ao devolver conexão para o pool
; DISCARD ALL limpa todas as configurações de sessão
server_reset_query = DISCARD ALL

; Ignorar parâmetros extras do cliente
ignore_startup_parameters = extra_float_digits
