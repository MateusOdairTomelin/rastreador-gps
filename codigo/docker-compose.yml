version: '3.8'

services:
  # ============ BANCO DE DADOS (TimescaleDB) ============
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: rastreador-db
    restart: unless-stopped
    # ✅ LIMITES DE RECURSOS
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'
        reservations:
          memory: 1G
          cpus: '1'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-L5430ZEumKwHIlEeecXX}
      POSTGRES_DB: rastreador_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migrate-timescaledb.sql:/docker-entrypoint-initdb.d/99-timescale.sql:ro
    ports:
      - "5432:5432"
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=10MB
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rastreador_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rastreador-network

  # ============ APLICAÇÃO ============
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rastreador-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ✅ LIMITES DE RECURSOS - Evita competição com outros containers
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '4'
        reservations:
          memory: 512M
          cpus: '1'
    environment:
      NODE_ENV: production
      # Conexão direta ao PostgreSQL (sem PgBouncer por enquanto)
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-L5430ZEumKwHIlEeecXX}@postgres:5432/rastreador_db?schema=public
      # Conexão direta para migrações Prisma
      DATABASE_URL_DIRECT: postgresql://postgres:${DB_PASSWORD:-L5430ZEumKwHIlEeecXX}@postgres:5432/rastreador_db?schema=public
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-L5430ZEumKwHIlEeecXX}
      DB_NAME: rastreador_db
      API_PORT: 62000
      HTTP_PORT: 62000
      TCP_PORT: 8877
      TCP_PORT_OBD2: 8878
      TELTONIKA_PORT: 8879
      JWT_SECRET: ${JWT_SECRET:-XtG0pyFff/g85H5enWL5o6KSxgQwbSvhgTlZA7/dvKHGVL6I6xM00nIfyU6y72ueupGaVGwcG70KSJakivvYpg==}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      # Encryption Key (LGPD - dados sensíveis)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-4a2af02e2438b08f6fa34a539f0243f63c6b3a088c1c1a5c8f3520a22ec4df1c}
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-UI6+PBaM/EMhf7I4tX6i9qdhtzKg6nttX7VO28oGa90=}
      REDIS_DB: 0
      REDIS_ENABLED: "true"
      # Security Configuration
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:62000}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://127.0.0.1:62000}
    ports:
      - "62000:62000"  # HTTP/WebSocket
      - "8877:8877"    # TCP XT40_4F (Cabo)
      - "8878:8878"    # TCP XT40_OBD2
      - "8879:8879"    # TCP Teltonika (FMC800/920/003/650)
    volumes:
      - app_logs:/app/logs
      - app_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Acesso ao Docker para monitoramento de infraestrutura
    user: root  # Necessário para acessar Docker socket
    networks:
      - rastreador-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============ PGBOUNCER (connection pooling) ============
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: rastreador-pgbouncer
    restart: unless-stopped
    # ✅ LIMITES DE RECURSOS (leve)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-L5430ZEumKwHIlEeecXX}@postgres:5432/rastreador_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 20
    ports:
      - "6432:5432"
    networks:
      - rastreador-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ REDIS (cache/filas para escalabilidade) ============
  redis:
    image: redis:7-alpine
    container_name: rastreador-redis
    restart: unless-stopped
    # ✅ LIMITES DE RECURSOS
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'
        reservations:
          memory: 256M
          cpus: '0.5'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rastreador-network
    command: >
      redis-server
      --appendonly yes
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-UI6+PBaM/EMhf7I4tX6i9qdhtzKg6nttX7VO28oGa90=}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-UI6+PBaM/EMhf7I4tX6i9qdhtzKg6nttX7VO28oGa90=}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ PROMETHEUS (métricas) ============
  prometheus:
    image: prom/prometheus:latest
    container_name: rastreador-prometheus
    restart: unless-stopped
    # ✅ LIMITES DE RECURSOS
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - rastreador-network
    depends_on:
      - app

  # ============ GRAFANA (dashboards) ============
  grafana:
    image: grafana/grafana:latest
    container_name: rastreador-grafana
    restart: unless-stopped
    # ✅ LIMITES DE RECURSOS
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - rastreador-network
    depends_on:
      - prometheus

networks:
  rastreador-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local
  app_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
