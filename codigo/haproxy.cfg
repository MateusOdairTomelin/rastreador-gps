# HAProxy Configuration for GPS Tracker Platform
# Load balancing for TCP (trackers) and HTTP (API/Frontend)

global
    log stdout format raw local0
    maxconn 10000
    tune.ssl.default-dh-param 2048

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    retries 3

# ============ FRONTEND TCP (Rastreadores) ============
frontend tcp_trackers
    bind *:8877
    mode tcp
    option tcplog

    # Sticky session por IP de origem (mesmo rastreador → mesmo gateway)
    default_backend tcp_gateways

# ============ BACKEND TCP GATEWAYS ============
backend tcp_gateways
    mode tcp
    balance source
    option tcp-check

    # TCP Gateways
    server gw-1 tcp-gateway-1:8877 check inter 5s fall 3 rise 2
    server gw-2 tcp-gateway-2:8877 check inter 5s fall 3 rise 2 backup

# ============ FRONTEND HTTP (API/Frontend) ============
frontend http_api
    bind *:80
    bind *:62000
    mode http
    option httplog

    # Headers de segurança
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff

    # WebSocket detection
    acl is_websocket hdr(Upgrade) -i websocket

    # Backend selection
    use_backend api_websocket if is_websocket
    default_backend api_servers

# ============ BACKEND API SERVERS ============
backend api_servers
    mode http
    balance roundrobin
    option httpchk GET /api/status
    http-check expect status 200

    # Sticky sessions para autenticação
    cookie SERVERID insert indirect nocache

    # API Servers
    server api-1 api-server-1:62000 check inter 10s fall 3 rise 2 cookie api1
    server api-2 api-server-2:62000 check inter 10s fall 3 rise 2 cookie api2 backup

# ============ BACKEND WEBSOCKET ============
backend api_websocket
    mode http
    balance source
    option http-server-close

    # WebSocket timeout longer
    timeout tunnel 3600s

    # API Servers (WebSocket)
    server api-1 api-server-1:62000 check
    server api-2 api-server-2:62000 check backup

# ============ STATS (Opcional) ============
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:LEsbsA9UPHz25d3XBxNmx0dObkHDJnu
